name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Installer Gradle pour générer le wrapper
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Générer le wrapper s'il n'existe pas
      - name: Generate Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper
            chmod +x gradlew
          else
            chmod +x gradlew
          fi

      # Créer un google-services.json vide
      - name: Create dummy google-services.json
        run: |
          echo '{
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy"
            },
            "client": [],
            "configuration_version": "1"
          }' > app/google-services.json

      # Créer le keystore de debug
      - name: Create debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug, O=Android, C=US"

      # Build avec le wrapper
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhaHack-Debug-APK
          path: app/build/outputs/apk/debug/*.apk