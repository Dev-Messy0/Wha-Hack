name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Créer le keystore de debug
      - name: Create debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug, O=Android, C=US"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WhaHack-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    # Se déclenche sur les tags ou en manuel
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Créer le keystore de release avec des identifiants fixes
      - name: Create release keystore
        run: |
          keytool -genkey -v -keystore my-upload-key.jks \
            -storepass whahack2024 \
            -alias upload \
            -keypass whahack2024 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=WhaHack, OU=Dev, O=WhaHack, L=Paris, S=France, C=FR"

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_PATH: my-upload-key.jks
          STORE_PASSWORD: whahack2024
          KEY_PASSWORD: whahack2024

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: WhaHack-Release-APK
          path: app/build/outputs/apk/release/*.apk

      # Optionnel: Créer une Release GitHub automatiquement
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}